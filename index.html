<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Penentu milai huruf</h2>
    <label for="nilai">Masukan Nilai  (0-100) :</label>
    <input type="number" id="Nilai" placeholder="contoh: 85">
    <button onclick="cekNilai ()">Cek</button>

    <p id="hasil"></p>

<script>
        function cekNilai() {
            let nilai = Number(document.getElementById("Nilai").value);
            let grade;
            let keterangan;

            if (nilai >= 90) {
                grade = "A";
            } else if (nilai >= 80) {
                grade = "B";
            } else if (nilai >= 70) {
                grade = "C";
            } else {
                grade = "D";
            }

            switch (grade) {
                case "A":
                    keterangan = "Sangat baik";
                    break;

                case "B":
                    keterangan = "Baik";
                    break;

                case "C":
                    keterangan = "Cukup";
                    break;

                default:
                    keterangan = "Perlu belajar lagi";
            }

            document.getElementById("hasil").innerHTML =
                "Nilai kamu: " + grade + " (" + keterangan + ")";
        }
</script>

    
</body>


</html>
